<svg width="48" height="48" viewBox="0 0 50 50" xmlns="http://www.w3.org/2000/svg">
<style>
.spinner {
  stroke: #3b82f6;
  opacity: .7;
  stroke-linecap: round;
  transform-origin: center;
  animation: rotate 1.4s linear infinite, dash 1.4s ease-in-out infinite;
}
@keyframes rotate {
  100% { transform: rotate(360deg); }
}
@keyframes dash {
  0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
  50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
  100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
}
</style>
<circle class="spinner" cx="25" cy="25" r="20" fill="none" stroke-width="10" />
</svg>
